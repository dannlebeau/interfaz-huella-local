<!--
    Huella Local · Mejillones 2050 - Codigos QR por mesa
    Genera un QR por mesa que abre mejillones-2050.html con la mesa
    pre-seleccionada y bloqueada (?mesa=Mesa%20N). Solo para imprimir antes
    del taller -- no depende de ningun servicio externo, el QR se genera
    en el navegador.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Huella Local">
    <meta name="description" content="Códigos QR de acceso por mesa - Mejillones 2050">
    <title>QR por mesa - Mejillones 2050</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/mejillones-2050.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="qr-page">
    <div class="qr-page-header">
        <div>
            <span class="mp-eyebrow">Plan Mejillones 2050</span>
            <h1>Códigos QR por mesa</h1>
            <p>Imprime esta hoja y deja un QR en cada mesa. Al escanearlo, el
            celular abre el mapeo participativo con esa mesa ya seleccionada
            y bloqueada, sin pasos extra.</p>
        </div>
        <div class="qr-page-actions">
            <a href="./mejillones-2050.html" class="mp-back-link" style="position:static; display:inline-block;">← Volver al mapa</a>
            <button onclick="window.print()" class="btn-primary">🖨️ Imprimir</button>
        </div>
    </div>

    <div id="qrGrid" class="qr-grid"></div>
</div>

<script>
    const CANTIDAD_MESAS = 10;
    const grid = document.getElementById('qrGrid');

    for (let i = 1; i <= CANTIDAD_MESAS; i++) {
        const nombreMesa = `Mesa ${i}`;
        const url = new URL(`mejillones-2050.html?mesa=${encodeURIComponent(nombreMesa)}`, window.location.href).href;

        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
            <div class="qr-card-label">${nombreMesa}</div>
            <div class="qr-card-code"></div>
            <div class="qr-card-url">${url}</div>
        `;
        grid.appendChild(card);

        new QRCode(card.querySelector('.qr-card-code'), {
            text: url,
            width: 150,
            height: 150,
            colorDark: '#2c3e50',
            colorLight: '#ffffff'
        });
    }
</script>

</body>
</html>
